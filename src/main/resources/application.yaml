server:
    port: 8080
    servlet:
        context-path: /casa-api

spring:
    config:
        import: optional:file:./config/dev-secrets.yaml
    datasource:
        driver-class-name: org.postgresql.Driver
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 300000
            connection-timeout: 20000
    jpa:
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                default_batch_fetch_size: 100
                jdbc:
                    batch_size: 50
                    batch_versioned_data: true
                    time_zone: America/Sao_Paulo
                order_inserts: true
                order_updates: true
                connection:
                    provider_disables_autocommit: false
                generate_statistics: false
                query:
                    in_clause_parameter_padding: true
                    fail_on_pagination_over_collection_fetch: true
                session:
                    events:
                        log:
                            LOG_QUERIES_SLOWER_THAN_MS: 1000
    hibernate:
        ddl-auto: none
    jackson:
        serialization:
            FAIL_ON_EMPTY_BEANS: false

springdoc:
    api-docs:
        enabled: ${SWAGGER_ENABLED:true}
    swagger-ui:
        enabled: ${SWAGGER_ENABLED:true}
        operations-sorter: alpha
        tags-sorter: alpha
        persist-authorization: true
        display-request-duration: true
    default-produces-media-type: application/json

api:
    key: ${API_KEY:}

auth:
    jwt:
        secret: ${JWT_SECRET:}
        expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
    admin:
        email: ${AUTH_ADMIN_EMAIL:}
        senha: ${AUTH_ADMIN_SENHA:}

app:
    cors:
        allowed-origins: ${CORS_URL:http://localhost:3000}

# Monitoramento do servidor: lê /proc e /sys a cada minuto e grava o histórico no MariaDB.
monitor:
    habilitado: ${MONITOR_HABILITADO:true}
    coleta-cron: ${MONITOR_COLETA_CRON:0 * * * * *}
    retencao-dias: ${MONITOR_RETENCAO_DIAS:365}
    proc-path: ${MONITOR_PROC_PATH:/proc}
    sys-path: ${MONITOR_SYS_PATH:/sys}
    hostname-arquivo: ${MONITOR_HOSTNAME_ARQUIVO:/etc/hostname}
    discos: ${MONITOR_DISCOS:Sistema=/}
    # API do Docker para os containers (proxy só-leitura); vazio desliga essa parte
    docker-url: ${MONITOR_DOCKER_URL:}
    retencao-containers-dias: ${MONITOR_RETENCAO_CONTAINERS_DIAS:90}
    # JSON com a temperatura dos discos (SMART), gravado no host pelo timer casa-monitor-smart; vazio desliga
    smart-arquivo: ${MONITOR_SMART_ARQUIVO:}
    datasource:
        url: ${MONITOR_DATASOURCE_URL:jdbc:mariadb://mariadb:3306/casa_monitor}
        username: ${MONITOR_DATASOURCE_USERNAME:casa_monitor}
        password: ${MONITOR_DATASOURCE_PASSWORD:}

server:
    port: 8080
    servlet:
        context-path: /casa-api

spring:
    datasource:
        driver-class-name: org.postgresql.Driver
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        password: ${SPRING_DATASOURCE_PASSWORD:postgres}
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/casa}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 300000
            connection-timeout: 20000
    jpa:
        database: POSTGRESQL
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                jdbc:
                    batch_size: 50
                    batch_versioned_data: true
                    time_zone: America/Sao_Paulo
                order_inserts: true
                order_updates: true
                connection:
                    provider_disables_autocommit: false
                generate_statistics: false
                query:
                    in_clause_parameter_padding: true
                    fail_on_pagination_over_collection_fetch: true
                session:
                    events:
                        log:
                            LOG_QUERIES_SLOWER_THAN_MS: 1000
    hibernate:
        ddl-auto: none
    jackson:
        serialization:
            FAIL_ON_EMPTY_BEANS: false

telegram:
    user: ${TELEGRAM_USER:user}
    token: ${TELEGRAM_TOKEN:token}
    chatid: ${TELEGRAM_CHAT_ID:chatId}
    enabled: ${TELEGRAM_ENABLED:false}
api:
    key: ${API_KEY:api-token}

# API Football Data
futebol:
    api:
        token: ${FUTEBOL_API_TOKEN:apiToken}

# Configurações do Feign
feign:
    client:
        config:
            footballDataApi:
                connectTimeout: 5000
                readTimeout: 30000


app:
    cors:
        allowed-origins: ${CORS_URL:http://localhost:3000}